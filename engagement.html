<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>VoirAnime — Engagement</title>
  <link rel="stylesheet" href="style.css"/>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;900&display=swap" rel="stylesheet">
  <style>
    .nav-logo{text-decoration:none;display:inline-flex;align-items:center}
    .logo-glitch{display:inline-block;font-family:'Outfit',sans-serif;font-size:1.45rem;font-weight:900;letter-spacing:-.5px;transform:skewX(-6deg);position:relative;user-select:none}
    .logo-glitch::before,.logo-glitch::after{content:attr(data-text);position:absolute;top:0;left:0;width:100%;height:100%;font-family:inherit;font-size:inherit;font-weight:inherit;letter-spacing:inherit;opacity:0;pointer-events:none}
    .logo-glitch::before{color:#22d3ee;clip-path:polygon(0 15%,100% 15%,100% 45%,0 45%);animation:va-gr-auto 5s steps(2) infinite;opacity:1}
    .logo-glitch::after{color:#a78bfa;clip-path:polygon(0 55%,100% 55%,100% 85%,0 85%);animation:va-gb-auto 5s steps(2) .06s infinite;opacity:1}
    @keyframes va-gr-auto{0%{transform:translate(-2px,1px);opacity:1}4%{transform:translate(2px,-1px);opacity:1}8%{transform:translate(-1px,2px);opacity:1}8.1%,100%{transform:translate(0,0);opacity:0}}
    @keyframes va-gb-auto{0%{transform:translate(2px,-1px);opacity:1}4%{transform:translate(-2px,1px);opacity:1}8%{transform:translate(1px,-2px);opacity:1}8.1%,100%{transform:translate(0,0);opacity:0}}
    .logo-voir{color:#fff;animation:va-gw 2.6s ease-in-out infinite}
    .logo-anime{color:#22d3ee;animation:va-gp 2.6s ease-in-out infinite .4s}
    @keyframes va-gw{0%,100%{text-shadow:0 0 4px rgba(34,211,238,.4),0 0 10px rgba(34,211,238,.2)}50%{text-shadow:0 0 8px rgba(34,211,238,.9),0 0 20px rgba(34,211,238,.5),0 0 36px rgba(167,139,250,.3)}}
    @keyframes va-gp{0%,100%{text-shadow:0 0 5px rgba(34,211,238,.6),0 0 14px rgba(167,139,250,.3)}50%{text-shadow:0 0 10px #22d3ee,0 0 24px rgba(34,211,238,.7),0 0 40px rgba(167,139,250,.45)}}

    .eng-page { max-width: 860px; margin: 0 auto; padding: 0 16px 60px; }

    /* Big stat */
    .eng-hero {
      text-align: center;
      padding: 32px 24px 28px;
      border: 1px solid rgba(167,139,250,.2);
      border-radius: 16px;
      background: linear-gradient(135deg, rgba(167,139,250,.07), rgba(34,211,238,.04));
      margin-bottom: 24px;
    }
    .eng-hours {
      font-family: 'Outfit', sans-serif;
      font-size: clamp(3rem, 12vw, 5rem);
      font-weight: 900;
      color: #a78bfa;
      line-height: 1;
      text-shadow: 0 0 40px rgba(167,139,250,.4);
    }
    .eng-hours-label {
      font-size: .8rem;
      color: rgba(255,255,255,.4);
      margin-top: 6px;
      letter-spacing: .08em;
      text-transform: uppercase;
    }
    .eng-equivalents {
      display: flex;
      justify-content: center;
      gap: 12px;
      flex-wrap: wrap;
      margin-top: 20px;
    }
    .eng-equiv {
      font-size: .75rem;
      padding: 5px 14px;
      border-radius: 20px;
      background: rgba(167,139,250,.1);
      border: 1px solid rgba(167,139,250,.2);
      color: rgba(255,255,255,.6);
    }
    .eng-equiv strong { color: #c4b5fd; }

    /* Breakdown */
    .eng-section-title {
      font-family: 'Outfit', sans-serif;
      font-size: .8rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .1em;
      color: rgba(255,255,255,.35);
      margin: 0 0 12px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .eng-section-title::after { content:''; flex:1; height:1px; background:rgba(255,255,255,.07); }

    .eng-list { display: flex; flex-direction: column; gap: 8px; margin-bottom: 28px; }
    .eng-row {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 14px;
      border-radius: 12px;
      border: 1px solid rgba(255,255,255,.06);
      background: rgba(255,255,255,.03);
      text-decoration: none;
      transition: border-color .18s, background .18s;
    }
    .eng-row:hover { background: rgba(167,139,250,.07); border-color: rgba(167,139,250,.25); }
    .eng-row-img {
      width: 38px; height: 54px;
      border-radius: 6px;
      object-fit: cover;
      flex-shrink: 0;
      background: rgba(255,255,255,.06);
    }
    .eng-row-info { flex: 1; min-width: 0; }
    .eng-row-title {
      font-size: .82rem;
      font-weight: 600;
      color: rgba(255,255,255,.85);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .eng-row-sub { font-size: .68rem; color: rgba(255,255,255,.3); margin-top: 2px; }
    .eng-row-hours {
      font-family: 'Outfit', sans-serif;
      font-size: .85rem;
      font-weight: 700;
      color: #a78bfa;
      flex-shrink: 0;
    }

    /* Empty */
    .eng-empty {
      text-align: center;
      padding: 48px 20px;
      color: rgba(255,255,255,.3);
    }
    .eng-empty-icon { font-size: 2.5rem; margin-bottom: 12px; }
    .eng-empty a {
      display: inline-block;
      margin-top: 14px;
      padding: 8px 20px;
      border-radius: 20px;
      background: rgba(167,139,250,.12);
      border: 1px solid rgba(167,139,250,.3);
      color: #c4b5fd;
      text-decoration: none;
      font-size: .78rem;
      font-weight: 700;
    }
  </style>
  <script src="js/i18n.js"></script>
  <script src="featuresManager.js"></script>
  <script src="premiumManager.js"></script>
</head>
<body>

<nav class="navbar scrolled" id="navbar">
  <div class="nav-top">
    <div class="nav-left">
      <div class="nav-logo-wrap">
        <a href="index.html" class="nav-logo" aria-label="VoirAnime">
          <span class="logo-glitch" data-text="VoirAnime">
            <span class="logo-voir">Voir</span><span class="logo-anime">Anime</span>
          </span>
        </a>
        <span class="logo-tagline">Découvre autrement.</span>
      </div>
    </div>
    <a href="profile.html" class="nav-avatar-btn nav-avatar-left" id="navAvatarBtn" title="Mon profil">
      <img class="nav-avatar-img" id="navAvatarImg" src="" alt="Profil"
           onerror="this.style.display='none';document.getElementById('navAvatarFallback').style.display='flex'"/>

    <div class="nav-right"></div>
  </div>
  <ul class="nav-links">
    <li><a href="index.html" class="nav-link">Home</a></li>
    <li><a href="catalogue.html" class="nav-link">Catalogue</a></li>
    <li><a href="duel.html" class="nav-link">⚔ Duels</a></li>
    <li><a href="news.html" class="nav-link">📰 News</a></li>
    <li><a href="soutenir.html" class="nav-link nav-link-support">💜 Support</a></li>
  </ul>
</nav>

<div class="subpage-header">
  <a href="profile.html" class="subpage-back">← Profil</a>
  <h1 class="subpage-title">⏱ Engagement</h1>
</div>

<div class="eng-page">

  <!-- Big stat -->
  <div class="eng-hero">
    <div class="eng-hours" id="engHours">0h</div>
    <div class="eng-hours-label">de visionnage cumulé</div>
    <div class="eng-equivalents" id="engEquivs"></div>
  </div>

  <!-- Liste des animes terminés par heures -->
  <div class="eng-section-title">Animes terminés</div>
  <div class="eng-list" id="engList"></div>

  <div class="eng-empty hidden" id="engEmpty">
    <div class="eng-empty-icon">⏱</div>
    <p>Termine des animes pour voir tes heures cumulées.</p>
    <a href="index.html">Explorer le catalogue →</a>
  </div>

</div>

<footer class="site-footer">
  <div class="footer-logo">Voir<span>Anime</span></div>
  <p class="footer-text">Aucune vidéo n'est hébergée sur ce site.</p>
</footer>

<script>
(function () {
  function getWatchStatus() {
    try { return JSON.parse(localStorage.getItem('VoirAnime_watchStatus') || '{}'); } catch (_) { return {}; }
  }

  function formatHours(mins) {
    var h = Math.floor(mins / 60);
    var m = mins % 60;
    if (h === 0) return m + 'min';
    if (m === 0) return h + 'h';
    return h + 'h ' + m + 'min';
  }

  function init() {
    var raw = getWatchStatus();
    var completed = [];
    Object.keys(raw).forEach(function (id) {
      var a = raw[id];
      if (a && a.status === 'completed') {
        var mins = (a.episodes || 0) * (a.duration || 24);
        completed.push(Object.assign({}, a, { id: id, mins: mins }));
      }
    });

    completed.sort(function (a, b) { return b.mins - a.mins; });

    var totalMins = completed.reduce(function (acc, a) { return acc + a.mins; }, 0);
    var totalH    = Math.floor(totalMins / 60);
    var totalM    = totalMins % 60;

    // Big stat
    var hoursEl = document.getElementById('engHours');
    if (hoursEl) hoursEl.textContent = totalH + 'h' + (totalM > 0 ? ' ' + totalM + 'min' : '');

    // Équivalences fun
    var equivEl = document.getElementById('engEquivs');
    if (equivEl && totalMins > 0) {
      var equivs = [];
      if (totalMins >= 90)  equivs.push('<span class="eng-equiv">≈ <strong>' + Math.round(totalMins / 90) + '</strong> films</span>');
      if (totalMins >= 1440) equivs.push('<span class="eng-equiv">≈ <strong>' + (totalMins / 1440).toFixed(1) + '</strong> jours</span>');
      if (completed.length)  equivs.push('<span class="eng-equiv"><strong>' + completed.length + '</strong> séries terminées</span>');
      equivEl.innerHTML = equivs.join('');
    }

    // Liste
    var list  = document.getElementById('engList');
    var empty = document.getElementById('engEmpty');

    if (!completed.length) {
      if (empty) empty.classList.remove('hidden');
      return;
    }
    if (empty) empty.classList.add('hidden');

    completed.forEach(function (a) {
      var row = document.createElement('a');
      row.className = 'eng-row';
      row.href = 'anime.html?id=' + a.id;
      var imgSrc = a.img || a.image_url || '';
      var hLabel = formatHours(a.mins);
      row.innerHTML =
        '<img src="' + imgSrc + '" alt="' + (a.title || '') + '" class="eng-row-img" loading="lazy" ' +
             'onerror="this.src=\'https://placehold.co/38x54/0f0e1a/555?text=?\'">' +
        '<div class="eng-row-info">' +
          '<div class="eng-row-title">' + (a.title || 'Anime') + '</div>' +
          '<div class="eng-row-sub">' + (a.episodes || '?') + ' épisodes · ' + (a.duration || 24) + 'min/ep</div>' +
        '</div>' +
        '<div class="eng-row-hours">' + hLabel + '</div>';
      list.appendChild(row);
    });
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init);
  else init();
})();
</script>

<script>
(function(){
  var overlay = document.createElement("div");
  overlay.className = "page-transition-overlay in";
  document.body.appendChild(overlay);
  setTimeout(function(){ overlay.remove(); }, 450);
  document.addEventListener("click", function(e){
    var link = e.target.closest("a[href]");
    if (!link) return;
    var href = link.getAttribute("href");
    if (!href || href.startsWith("#") || href.startsWith("http") || href.startsWith("mailto") || link.target === "_blank") return;
    e.preventDefault();
    var ov = document.createElement("div");
    ov.className = "page-transition-overlay out";
    document.body.appendChild(ov);
    setTimeout(function(){ window.location.href = href; }, 340);
  });
})();
</script>
<script>
(function(){
  var bar = document.createElement('div');
  bar.className = 'scroll-progress';
  document.body.prepend(bar);
  window.addEventListener('scroll', function(){
    var h=document.documentElement;
    bar.style.width=Math.min((h.scrollTop/(h.scrollHeight-h.clientHeight))*100,100)+'%';
  },{passive:true});
  try{
    var saved=JSON.parse(localStorage.getItem('VoirAnime_avatar')||'null');
    if(saved&&saved.img){
      document.querySelectorAll('.nav-avatar-img').forEach(function(i){i.src=saved.img;i.style.display='block';});
      document.querySelectorAll('.nav-avatar-fallback').forEach(function(f){f.style.display='none';});
    }
  }catch(_){}
  function tryInit(){
    var raw=localStorage.getItem('pi_user');if(!raw)return;
    try{var u=JSON.parse(raw);if(u&&u.uid){if(window.VA_initFeatures)window.VA_initFeatures(u.uid);if(window.VA_initPremium)window.VA_initPremium(u.uid);}}catch(_){}
  }
  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',tryInit);else tryInit();
})();
</script>
</body>
