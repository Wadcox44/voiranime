<html lang="fr">
<head>

  <style>
/* ═══════════════════════════════════════════
   CONTACT MODAL — VoirAnime
   Dark / Glassmorphism / Premium
   ═══════════════════════════════════════════ */

/* ── RESET & BASE ───────────────────────── */
*,
*::before,
*::after {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

:root {
  /* palette */
  --va-bg:            #0b0d14;
  --va-surface:       rgba(18, 22, 36, .72);
  --va-surface-solid: #121624;
  --va-border:        rgba(255, 255, 255, .08);
  --va-border-focus:  rgba(124, 92, 252, .55);
  --va-text:          #e8eaf0;
  --va-text-muted:    #8b90a0;
  --va-accent:        #7c5cfc;
  --va-accent-glow:   rgba(124, 92, 252, .35);
  --va-accent-hover:  #9478ff;
  --va-success:       #34d399;
  --va-danger:        #f87171;
  --va-radius:        12px;
  --va-radius-sm:     8px;
  --va-font:          'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  --va-transition:    .22s cubic-bezier(.4,0,.2,1);
}

body {
  font-family: var(--va-font);
  background: var(--va-bg);
  color: var(--va-text);
  min-height: 100vh;
  -webkit-font-smoothing: antialiased;
}

/* ── DEMO TRIGGER (remove in production) ── */
.demo-trigger-wrapper {
  display: flex;
  justify-content: center;
  align-items: center;
  min-height: 100vh;
}
.demo-open-btn {
  display: inline-flex;
  align-items: center;
  gap: 10px;
  padding: 14px 32px;
  font-family: var(--va-font);
  font-size: 15px;
  font-weight: 600;
  color: #fff;
  background: linear-gradient(135deg, var(--va-accent), #a78bfa);
  border: none;
  border-radius: 50px;
  cursor: pointer;
  transition: transform var(--va-transition), box-shadow var(--va-transition);
  box-shadow: 0 4px 24px var(--va-accent-glow);
}
.demo-open-btn:hover {
  transform: translateY(-2px) scale(1.03);
  box-shadow: 0 8px 32px var(--va-accent-glow);
}
.demo-open-btn__icon {
  font-size: 18px;
}

/* ═══════════════════════════════════════════
   MODAL OVERLAY
   ═══════════════════════════════════════════ */
.contact-modal {
  position: fixed;
  inset: 0;
  z-index: 9999;
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 20px;
  /* hidden by default */
  opacity: 0;
  visibility: hidden;
  transition: opacity .3s ease, visibility .3s ease;
}
.contact-modal.is-open {
  opacity: 1;
  visibility: visible;
}

/* backdrop */
.contact-modal__backdrop {
  position: absolute;
  inset: 0;
  background: rgba(0, 0, 0, .65);
  backdrop-filter: blur(6px);
  -webkit-backdrop-filter: blur(6px);
}

/* ═══════════════════════════════════════════
   CARD — glassmorphism
   ═══════════════════════════════════════════ */
.contact-modal__card {
  position: relative;
  width: 100%;
  max-width: 560px;
  max-height: 90vh;
  overflow-y: auto;
  background: var(--va-surface);
  backdrop-filter: blur(20px) saturate(1.4);
  -webkit-backdrop-filter: blur(20px) saturate(1.4);
  border: 1px solid var(--va-border);
  border-radius: 20px;
  padding: 36px 32px 32px;
  box-shadow:
    0 0 0 1px rgba(255,255,255,.04) inset,
    0 24px 80px -12px rgba(0, 0, 0, .6),
    0 0 60px -20px var(--va-accent-glow);
  /* entrance animation */
  transform: scale(.92) translateY(16px);
  transition: transform .35s cubic-bezier(.34,1.56,.64,1), opacity .3s ease;
}
.contact-modal.is-open .contact-modal__card {
  transform: scale(1) translateY(0);
}

/* scrollbar styling */
.contact-modal__card::-webkit-scrollbar {
  width: 6px;
}
.contact-modal__card::-webkit-scrollbar-track {
  background: transparent;
}
.contact-modal__card::-webkit-scrollbar-thumb {
  background: rgba(255,255,255,.12);
  border-radius: 3px;
}

/* ── CLOSE BTN ──────────────────────────── */
.contact-modal__close {
  position: absolute;
  top: 16px;
  right: 16px;
  display: flex;
  align-items: center;
  justify-content: center;
  width: 36px;
  height: 36px;
  border: 1px solid var(--va-border);
  border-radius: 10px;
  background: rgba(255,255,255,.04);
  color: var(--va-text-muted);
  cursor: pointer;
  transition: background var(--va-transition), color var(--va-transition), border-color var(--va-transition);
}
.contact-modal__close:hover {
  background: rgba(255,255,255,.08);
  color: #fff;
  border-color: rgba(255,255,255,.15);
}

/* ═══════════════════════════════════════════
   HEADER
   ═══════════════════════════════════════════ */
.contact-modal__header {
  text-align: center;
  margin-bottom: 28px;
}
.contact-modal__title {
  font-size: 24px;
  font-weight: 700;
  letter-spacing: -.02em;
  background: linear-gradient(135deg, #fff 30%, var(--va-accent-hover));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}
.contact-modal__subtitle {
  margin-top: 6px;
  font-size: 13.5px;
  color: var(--va-text-muted);
  font-weight: 400;
}

/* ═══════════════════════════════════════════
   FORM LAYOUT
   ═══════════════════════════════════════════ */
.contact-form {
  display: flex;
  flex-direction: column;
  gap: 20px;
}

.contact-form__group {
  display: flex;
  flex-direction: column;
  gap: 6px;
}

.contact-form__row {
  display: flex;
  gap: 16px;
}
.contact-form__group--half {
  flex: 1;
  min-width: 0;
}

/* ── LABELS ─────────────────────────────── */
.contact-form__label {
  font-size: 12.5px;
  font-weight: 600;
  color: var(--va-text-muted);
  letter-spacing: .03em;
  text-transform: uppercase;
}
.contact-form__required {
  color: var(--va-accent);
  margin-left: 2px;
}
.contact-form__optional {
  font-weight: 400;
  text-transform: none;
  font-size: 11.5px;
  opacity: .6;
}

/* ── INPUT / TEXTAREA / SELECT shared ───── */
.contact-form__input,
.contact-form__textarea,
.contact-form__select {
  width: 100%;
  font-family: var(--va-font);
  font-size: 14px;
  color: var(--va-text);
  background: rgba(255, 255, 255, .04);
  border: 1px solid var(--va-border);
  border-radius: var(--va-radius);
  padding: 12px 14px;
  outline: none;
  transition:
    border-color var(--va-transition),
    box-shadow var(--va-transition),
    background var(--va-transition);
}
.contact-form__input::placeholder,
.contact-form__textarea::placeholder {
  color: rgba(139, 144, 160, .6);
}

/* focus highlight */
.contact-form__input:focus,
.contact-form__textarea:focus,
.contact-form__select:focus {
  border-color: var(--va-border-focus);
  background: rgba(124, 92, 252, .06);
  box-shadow: 0 0 0 3px rgba(124, 92, 252, .12), 0 0 20px -4px rgba(124, 92, 252, .15);
}

/* ── SELECT WRAPPER ─────────────────────── */
.contact-form__select-wrapper {
  position: relative;
}
.contact-form__select {
  appearance: none;
  -webkit-appearance: none;
  padding-right: 40px;
  cursor: pointer;
}
.contact-form__select option {
  background: var(--va-surface-solid);
  color: var(--va-text);
  padding: 8px;
}
.contact-form__select-chevron {
  position: absolute;
  right: 14px;
  top: 50%;
  transform: translateY(-50%);
  color: var(--va-text-muted);
  pointer-events: none;
  transition: color var(--va-transition);
}
.contact-form__select:focus + .contact-form__select-chevron {
  color: var(--va-accent);
}

/* ── TEXTAREA ───────────────────────────── */
.contact-form__textarea {
  resize: vertical;
  min-height: 120px;
  line-height: 1.6;
}

/* ═══════════════════════════════════════════
   SUBMIT BUTTON
   ═══════════════════════════════════════════ */
.contact-form__submit {
  position: relative;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  width: 100%;
  padding: 14px 24px;
  font-family: var(--va-font);
  font-size: 15px;
  font-weight: 600;
  letter-spacing: .01em;
  color: #fff;
  background: linear-gradient(135deg, var(--va-accent), #a270f7);
  border: none;
  border-radius: var(--va-radius);
  cursor: pointer;
  overflow: hidden;
  transition:
    transform var(--va-transition),
    box-shadow var(--va-transition),
    filter var(--va-transition);
  box-shadow: 0 4px 20px -4px var(--va-accent-glow);
}
.contact-form__submit::before {
  content: '';
  position: absolute;
  inset: 0;
  background: linear-gradient(135deg, rgba(255,255,255,.15), transparent 60%);
  opacity: 0;
  transition: opacity var(--va-transition);
}
.contact-form__submit:hover {
  transform: translateY(-1px);
  box-shadow: 0 8px 32px -4px var(--va-accent-glow), 0 0 20px -2px rgba(124,92,252,.3);
}
.contact-form__submit:hover::before {
  opacity: 1;
}
.contact-form__submit:active {
  transform: translateY(0) scale(.98);
}

/* loading state */
.contact-form__submit-loader {
  display: none;
}
.contact-form__submit.is-loading .contact-form__submit-text {
  opacity: 0;
}
.contact-form__submit.is-loading .contact-form__submit-loader {
  display: flex;
  position: absolute;
}
.contact-form__submit.is-loading {
  pointer-events: none;
  filter: brightness(.85);
}

/* ═══════════════════════════════════════════
   SUCCESS MESSAGE
   ═══════════════════════════════════════════ */
.contact-form__success {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 14px 16px;
  background: rgba(52, 211, 153, .1);
  border: 1px solid rgba(52, 211, 153, .25);
  border-radius: var(--va-radius);
  font-size: 13.5px;
  color: var(--va-success);
  animation: successIn .4s ease;
}
.contact-form__success[hidden] {
  display: none;
}
.contact-form__success-icon {
  font-size: 18px;
  flex-shrink: 0;
}

@keyframes successIn {
  from { opacity: 0; transform: translateY(8px); }
  to   { opacity: 1; transform: translateY(0); }
}

/* ═══════════════════════════════════════════
   RESPONSIVE — MOBILE
   ═══════════════════════════════════════════ */
@media (max-width: 600px) {
  .contact-modal {
    padding: 12px;
    align-items: flex-end;
  }
  .contact-modal__card {
    max-height: 92vh;
    padding: 28px 20px 24px;
    border-radius: 18px 18px 12px 12px;
  }
  .contact-form__row {
    flex-direction: column;
    gap: 20px;
  }
  .contact-modal__title {
    font-size: 20px;
  }
  .contact-modal__subtitle {
    font-size: 12.5px;
  }
}

@media (max-width: 380px) {
  .contact-modal__card {
    padding: 24px 16px 20px;
  }
}

/* ═══════════════════════════════════════════
   VALIDATION VISUAL FEEDBACK
   ═══════════════════════════════════════════ */
.contact-form__input:invalid:not(:placeholder-shown),
.contact-form__textarea:invalid:not(:placeholder-shown) {
  border-color: rgba(248, 113, 113, .45);
}
.contact-form__input:valid:not(:placeholder-shown),
.contact-form__textarea:valid:not(:placeholder-shown) {
  border-color: rgba(52, 211, 153, .3);
}

/* ═══════════════════════════════════════════
   SUBTLE AMBIENT GLOW BEHIND CARD
   ═══════════════════════════════════════════ */
.contact-modal__card::after {
  content: '';
  position: absolute;
  top: -40%;
  left: 50%;
  transform: translateX(-50%);
  width: 120%;
  height: 100%;
  background: radial-gradient(ellipse at center, rgba(124, 92, 252, .08) 0%, transparent 70%);
  pointer-events: none;
  z-index: -1;
}

/* ── Boutons priorité ────────────────────── */
.cm-prio {
  flex: 1; padding: 8px 4px;
  border-radius: 8px; border: 1px solid rgba(255,255,255,0.1);
  background: transparent; color: #8b90a0;
  font-size: 0.72rem; font-weight: 700;
  cursor: pointer; transition: all .18s; text-align: center;

}
.cm-prio.active-low    { border-color:#34d399;color:#34d399;background:rgba(52,211,153,.08); }
.cm-prio.active-medium { border-color:#f59e0b;color:#f59e0b;background:rgba(245,158,11,.08); }
.cm-prio.active-high   { border-color:#f87171;color:#f87171;background:rgba(248,113,113,.08); }

              <option value="" disabled selected>Choisis un sujet…</option>
            </select>
            <svg class="contact-form__select-chevron" width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M4 6l4 4 4-4" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </div>
        </div>

        <!-- Anime concerné (conditionnel) -->
        <div class="contact-form__group" id="cAnimeField" style="display:none">
          <label for="cAnime" class="contact-form__label">Anime concerné <span class="contact-form__optional">(optionnel)</span></label>
          <input id="cAnime" type="text" name="anime" placeholder="Ex : Demon Slayer, One Piece…" class="contact-form__input"/>
        </div>

        <!-- Message -->
        <div class="contact-form__group">
          <label for="cMessage" class="contact-form__label">Message <span class="contact-form__required">*</span></label>
          <textarea id="cMessage" name="message" required rows="6" placeholder="Décris ta demande en détail…" class="contact-form__textarea"></textarea>
        </div>

        <div class="c-error" id="cErrorMsg"></div>

        <button type="submit" class="contact-form__submit" id="cSubmitBtn">
          <span class="contact-form__submit-text">Envoyer le message ✉️</span>
          <span class="contact-form__submit-loader" aria-hidden="true">
            <svg width="20" height="20" viewBox="0 0 20 20"><circle cx="10" cy="10" r="8" stroke="currentColor" stroke-width="2.5" fill="none" stroke-dasharray="40 60" stroke-linecap="round"><animateTransform attributeName="transform" type="rotate" from="0 10 10" to="360 10 10" dur=".7s" repeatCount="indefinite"/></circle></svg>
          </span>
        </button>
      </form>
    </div>

  </div>
</main>

<script>
document.addEventListener('DOMContentLoaded', function() {
(function() {
  'use strict';

  var form      = document.getElementById('cForm');
  var submitBtn = document.getElementById('cSubmitBtn');
  var errMsg    = document.getElementById('cErrorMsg');
  var formWrap  = document.getElementById('cFormWrap');
  var success   = document.getElementById('cSuccessScreen');

  // ── Pré-remplir Pi ──────────────────────────────────────────────────
  document.getElementById('cLang').value = navigator.language || 'unknown';
  document.getElementById('cUrl').value  = window.location.href;

  var piUser = null;
  try { piUser = JSON.parse(localStorage.getItem('pi_user') || 'null'); } catch(e) {}

  if (piUser && piUser.uid) {
    document.getElementById('cPiBadge').classList.add('visible');
    document.getElementById('cPiName').textContent  = '@' + (piUser.username || piUser.uid.slice(0,8));
    document.getElementById('cPiUid').value         = piUser.uid;
    document.getElementById('cPiUsername').value    = piUser.username || '';
    document.getElementById('cManualFields').style.display = 'none';
  }

  // ── Sujets par catégorie ─────────────────────────────────────────────
  var SUBJECTS = {
    technique: [
      { value: 'bug_technique',   label: 'Bug technique' },
      { value: 'probleme_video',  label: 'Problème lecture vidéo' },
    ],
    contenu: [
      { value: 'anime_manquant',  label: 'Anime manquant' },
      { value: 'suggestion',      label: 'Suggestion d'amélioration' },
    ],
    paiement: [
      { value: 'probleme_abonnement', label: 'Problème abonnement / paiement' },
      { value: 'compte_pi',           label: 'Compte Pi / connexion' },
    ],
    pro: [
      { value: 'partenariat', label: 'Partenariat' },
      { value: 'business',    label: 'Business' },
      { value: 'autre',       label: 'Autre' },
    ],
  };
  var ANIME_SUBJECTS = ['anime_manquant','probleme_video','bug_technique'];

  // Fonctions globales appelées via onchange inline
  window.cShowSubjects = function(cat) {
    var subWrap    = document.getElementById('cSubjectWrap');
    var subSel     = document.getElementById('cSubject');
    var animeField = document.getElementById('cAnimeField');

    subSel.innerHTML = '<option value="" disabled selected>Choisis un sujet…</option>';
    (SUBJECTS[cat] || []).forEach(function(s) {
      var opt = document.createElement('option');
      opt.value = s.value; opt.textContent = s.label;
      subSel.appendChild(opt);
    });

    if ((SUBJECTS[cat] || []).length === 1) {
      subSel.value = SUBJECTS[cat][0].value;
      subWrap.style.display = 'none';
      animeField.style.display = ANIME_SUBJECTS.indexOf(subSel.value) !== -1 ? 'block' : 'none';
    } else {
      subWrap.style.display = 'block';
      animeField.style.display = 'none';
    }
  };

  window.cOnSubjectChange = function(val) {
    document.getElementById('cAnimeField').style.display =
      ANIME_SUBJECTS.indexOf(val) !== -1 ? 'block' : 'none';
  };

  // ── Envoi ────────────────────────────────────────────────────────────
  form.addEventListener('submit', function(e) {
    e.preventDefault();
    errMsg.textContent = '';

    var isPi = !!document.getElementById('cPiUid').value;
    if (!isPi) {
      var fn = document.getElementById('cFirstname').value.trim();
      var ln = document.getElementById('cLastname').value.trim();
      var em = document.getElementById('cEmail').value.trim();
      if (!fn || !ln) { errMsg.textContent = 'Merci de renseigner ton prénom et nom.'; return; }
      if (!em || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(em)) { errMsg.textContent = 'Adresse email invalide.'; return; }
    }
    if (!document.getElementById('cCategory').value) {
      errMsg.textContent = 'Merci de sélectionner une catégorie.'; return;
    }
    if (!document.getElementById('cSubject').value) {
      errMsg.textContent = 'Merci de sélectionner un sujet.'; return;
    }
    var msg = document.getElementById('cMessage').value.trim();
    if (msg.length < 10) { errMsg.textContent = 'Message trop court (min 10 caractères).'; return; }

    submitBtn.classList.add('is-loading');

    var fd = new FormData(form);
    var payload = {};
    fd.forEach(function(v, k) { if (v !== '') payload[k] = v; });

    fetch(form.action, {
      method:  'POST',
      body:    JSON.stringify(payload),
      headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' }
    })
    .then(function(r) { return r.json().then(function(d) { return { ok: r.ok, data: d }; }); })
    .then(function(res) {
      submitBtn.classList.remove('is-loading');
      if (res.ok && res.data.ok) {
        formWrap.style.display = 'none';
        success.classList.add('visible');
      } else {
        errMsg.textContent = res.data.error || 'Erreur lors de l\'envoi. Réessaie.';
      }
    })
    .catch(function() {
      submitBtn.classList.remove('is-loading');
      errMsg.textContent = 'Erreur réseau. Vérifie ta connexion.';
    });
  });
})();
}); // DOMContentLoaded
</script>

</body>
</html>
