<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>VoirAnime — Animes visités</title>
  <link rel="stylesheet" href="style.css"/>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;900&display=swap" rel="stylesheet">
  <style>
    /* ── Logo néon ── */
    .nav-logo{text-decoration:none;display:inline-flex;align-items:center}
    .logo-glitch{display:inline-block;font-family:'Outfit',sans-serif;font-size:1.45rem;font-weight:900;letter-spacing:-.5px;position:relative;user-select:none;transform:skewX(-6deg)}
    .logo-glitch::before,.logo-glitch::after{content:attr(data-text);position:absolute;top:0;left:0;width:100%;height:100%;font-family:inherit;font-size:inherit;font-weight:inherit;letter-spacing:inherit;opacity:0;pointer-events:none}
    .logo-glitch::before{color:#22d3ee;clip-path:polygon(0 15%,100% 15%,100% 45%,0 45%);animation:va-gr-auto 5s steps(2) infinite;opacity:1}
    .logo-glitch::after{color:#a78bfa;clip-path:polygon(0 55%,100% 55%,100% 85%,0 85%);animation:va-gb-auto 5s steps(2) .06s infinite;opacity:1}
    @keyframes va-gr-auto{0%{transform:translate(-2px,1px);opacity:1}4%{transform:translate(2px,-1px);opacity:1}8%{transform:translate(-1px,2px);opacity:1}8.1%,100%{transform:translate(0,0);opacity:0}}
    @keyframes va-gb-auto{0%{transform:translate(2px,-1px);opacity:1}4%{transform:translate(-2px,1px);opacity:1}8%{transform:translate(1px,-2px);opacity:1}8.1%,100%{transform:translate(0,0);opacity:0}}
    .logo-voir{color:#fff;animation:va-gw 2.6s ease-in-out infinite}
    .logo-anime{color:#22d3ee;animation:va-gp 2.6s ease-in-out infinite .4s}
    @keyframes va-gw{0%,100%{text-shadow:0 0 4px rgba(34,211,238,.4),0 0 10px rgba(34,211,238,.2)}50%{text-shadow:0 0 8px rgba(34,211,238,.9),0 0 20px rgba(34,211,238,.5),0 0 36px rgba(167,139,250,.3)}}
    @keyframes va-gp{0%,100%{text-shadow:0 0 5px rgba(34,211,238,.6),0 0 14px rgba(167,139,250,.3)}50%{text-shadow:0 0 10px #22d3ee,0 0 24px rgba(34,211,238,.7),0 0 40px rgba(167,139,250,.45)}}

    .vsort-btn {
      flex-shrink: 0;
      font-family: 'Outfit', sans-serif;
      font-size: .72rem;
      font-weight: 600;
      padding: 5px 14px;
      border-radius: 20px;
      border: 1px solid rgba(255,255,255,.08);
      background: rgba(255,255,255,.04);
      color: rgba(255,255,255,.45);
      cursor: pointer;
      transition: all .18s;
    }
    .vsort-btn.active {
      background: rgba(167,139,250,.18);
      border-color: rgba(167,139,250,.4);
      color: #c4b5fd;
    }
    .vsort-btn:hover { background: rgba(167,139,250,.1); border-color: rgba(167,139,250,.25); }
    .visited-sort {
      display: flex;
      gap: 6px;
      padding: 0 48px 16px;
      overflow-x: auto;
      scrollbar-width: none;
    }
    .visited-sort::-webkit-scrollbar { display: none; }
    .visited-card-date {
      font-size: .62rem;
      color: rgba(255,255,255,.28);
      padding: 0 8px 6px;
    }
    @media (max-width: 768px) {
      .visited-sort { padding: 0 16px 16px; }
    }
  </style>
</head>
<body>

<!-- NAVBAR -->
<nav class="navbar scrolled" id="navbar">
  <div class="nav-top">
    <div class="nav-left">
      <div class="nav-logo-wrap">
        <a href="index.html" class="nav-logo" aria-label="VoirAnime">
          <span class="logo-glitch" data-text="VoirAnime">
            <span class="logo-voir">Voir</span><span class="logo-anime">Anime</span>
          </span>
        </a>
        <span class="logo-tagline">Découvre autrement.</span>
      </div>
    </div>
    <a href="profile.html" class="nav-avatar-btn nav-avatar-left" id="navAvatarBtn" title="Mon profil">
      <img class="nav-avatar-img" id="navAvatarImg" src="" alt="Profil"
           onerror="this.style.display='none';document.getElementById('navAvatarFallback').style.display='flex'"/>
      <div class="nav-avatar-fallback" id="navAvatarFallback">👤</div>
    </a>
    <div class="nav-right"></div>
  </div>
  <ul class="nav-links">
    <li><a href="index.html" class="nav-link">Home</a></li>
    <li><a href="catalogue.html" class="nav-link">Catalogue</a></li>
    <li><a href="duel.html" class="nav-link">⚔ Duels</a></li>
    <li><a href="news.html" class="nav-link">📰 News</a></li>
    <li><a href="soutenir.html" class="nav-link nav-link-support">💜 Support</a></li>
  </ul>
</nav>

<!-- PAGE VISITÉS -->
<div class="subpage-header">
  <a href="profile.html" class="subpage-back">← Profil</a>
  <h1 class="subpage-title">📚 Animes visités</h1>
  <div class="subpage-meta" id="visitedMeta"></div>
</div>

<!-- Tri -->
<div class="visited-sort" id="visitedSort">
  <button class="vsort-btn active" data-sort="recent">Plus récents</button>
  <button class="vsort-btn" data-sort="alpha">A → Z</button>
  <button class="vsort-btn" data-sort="oldest">Plus anciens</button>
</div>

<div class="subpage-grid" id="visitedGrid"></div>
<div class="subpage-empty hidden" id="visitedEmpty">
  <div class="subpage-empty-icon">📚</div>
  <p>Aucun anime visité pour le moment.</p>
  <a href="index.html" class="subpage-cta">Explorer le catalogue →</a>
</div>

<footer class="site-footer">
  <div class="footer-logo">Voir<span>Anime</span></div>
  <p class="footer-text">Aucune vidéo n'est hébergée sur ce site.</p>
</footer>

<script>
(function () {
  function getHistory() {
    try { return JSON.parse(localStorage.getItem('VoirAnime_history') || '[]'); } catch (_) { return []; }
  }

  function timeAgo(ts) {
    if (!ts) return '';
    var diff = (Date.now() - ts) / 1000;
    if (diff < 60)    return 'À l\'instant';
    if (diff < 3600)  return 'il y a ' + Math.floor(diff / 60) + ' min';
    if (diff < 86400) return 'il y a ' + Math.floor(diff / 3600) + 'h';
    if (diff < 604800) return 'il y a ' + Math.floor(diff / 86400) + ' j';
    return new Date(ts).toLocaleDateString('fr-FR', { day: 'numeric', month: 'short' });
  }

  var currentSort = 'recent';
  var allAnimes = [];

  function dedupe(hist) {
    var seen = {}, out = [];
    hist.forEach(function (h) {
      if (h && h.id && !seen[h.id]) { seen[h.id] = true; out.push(h); }
    });
    return out;
  }

  function sorted(arr, sort) {
    var copy = arr.slice();
    if (sort === 'recent')  copy.sort(function (a, b) { return (b.ts || 0) - (a.ts || 0); });
    if (sort === 'oldest')  copy.sort(function (a, b) { return (a.ts || 0) - (b.ts || 0); });
    if (sort === 'alpha')   copy.sort(function (a, b) { return (a.title || '').localeCompare(b.title || '', 'fr'); });
    return copy;
  }

  function render(sort) {
    var grid  = document.getElementById('visitedGrid');
    var count = document.getElementById('visitedCount');
    if (!grid) return;

    var list = sorted(allAnimes, sort);
    if (count) count.textContent = list.length + ' anime' + (list.length > 1 ? 's' : '');

    grid.innerHTML = '';

    if (!list.length) {
      grid.innerHTML =
        '<div class="visited-empty" style="grid-column:1/-1">' +
          '<div class="visited-empty-icon">📚</div>' +
          '<div class="visited-empty-title">Aucun anime visité</div>' +
          '<p>Les animes que tu consultes apparaîtront ici automatiquement.</p>' +
          '<a href="index.html">Explorer le catalogue →</a>' +
        '</div>';
      return;
    }

    list.forEach(function (a, i) {
      var card = document.createElement('a');
      card.className = 'visited-card';
      card.href = 'anime.html?id=' + a.id;
      card.style.animationDelay = Math.min(i * 0.04, 0.5) + 's';

      var imgSrc = a.img || a.image_url || '';
      card.innerHTML =
        '<div class="visited-card-img-wrap">' +
          '<img class="visited-card-img" src="' + imgSrc + '" alt="' + (a.title || '') + '" loading="lazy" ' +
               'onerror="this.src=\'https://placehold.co/225x318/0f0e1a/555?text=?\'">' +
          '<div class="visited-card-overlay"></div>' +
        '</div>' +
        '<div class="visited-card-title">' + (a.title || 'Anime') + '</div>' +
        (a.ts ? '<div class="visited-card-date">' + timeAgo(a.ts) + '</div>' : '');

      grid.appendChild(card);
    });
  }

  function init() {
    allAnimes = dedupe(getHistory());
    render(currentSort);

    // Tri
    document.querySelectorAll('.vsort-btn').forEach(function (btn) {
      btn.addEventListener('click', function () {
        document.querySelectorAll('.vsort-btn').forEach(function (b) { b.classList.remove('active'); });
        btn.classList.add('active');
        currentSort = btn.dataset.sort;
        render(currentSort);
      });
    });
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }
})();
</script>

<!-- Transition entre pages -->
<script>
(function(){
  var overlay = document.createElement("div");
  overlay.className = "page-transition-overlay in";
  document.body.appendChild(overlay);
  setTimeout(function(){ overlay.remove(); }, 450);
  document.addEventListener("click", function(e){
    var link = e.target.closest("a[href]");
    if (!link) return;
    var href = link.getAttribute("href");
    if (!href || href.startsWith("#") || href.startsWith("http") || href.startsWith("mailto") || link.target === "_blank") return;
    e.preventDefault();
    var ov = document.createElement("div");
    ov.className = "page-transition-overlay out";
    document.body.appendChild(ov);
    setTimeout(function(){ window.location.href = href; }, 340);
  });
})();
</script>

<script>
(function(){
  var bar = document.createElement('div');
  bar.className = 'scroll-progress';
  document.body.prepend(bar);
  window.addEventListener('scroll', function() {
    var h = document.documentElement;
    bar.style.width = Math.min((h.scrollTop / (h.scrollHeight - h.clientHeight)) * 100, 100) + '%';
  }, { passive: true });
  try {
    var saved = JSON.parse(localStorage.getItem('VoirAnime_avatar') || 'null');
    if (saved && saved.img) {
      document.querySelectorAll('.nav-avatar-img').forEach(function(img) { img.src = saved.img; img.style.display = 'block'; });
      document.querySelectorAll('.nav-avatar-fallback').forEach(function(f) { f.style.display = 'none'; });
    }
  } catch(_) {}
})();
</script>

</body>
</html>
